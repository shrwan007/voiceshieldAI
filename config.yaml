# VoiceShield Pipeline Configuration
# All thresholds and tunable parameters live here.

audio:
  sample_rate: 16000          # Hz — standard for speech models
  silence_threshold_db: -40   # dB — frames below this are silence
  min_audio_length_sec: 1.0   # minimum valid clip length
  max_audio_length_sec: 30.0  # clip longer than this is rejected
  chunk_size_bytes: 4096      # WebSocket streaming chunk size

risk:
  # Risk level bands — adjust to tune sensitivity
  low_threshold: 0.35         # below this → Low risk
  medium_threshold: 0.65      # 0.35–0.65 → Medium risk
  high_threshold: 0.85        # above this → High risk (alert triggered)

model:
  detection_model: "speechbrain/aasist-spoof-detection"
  speaker_model: "speechbrain/spkrec-ecapa-voxceleb"
  device: "cpu"               # "cpu" or "cuda"
  speaker_similarity_threshold: 0.75  # cosine similarity for same-speaker

storage:
  audio_storage_path: "audio_storage"
  models_cache_path: "models_cache"
  max_file_size_mb: 50

api:
  history_default_limit: 20
  history_max_limit: 100
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
